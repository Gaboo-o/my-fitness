<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | myFitness</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Generated by myFitness five-page restructuring -->
    <header class="site-header">
        <div class="site-header-inner">
            <a class="brand" href="/">myFitness</a>
            <nav class="site-nav" aria-label="Main navigation">
            <a href="/">Dashboard</a>
            <a href="/workouts.html">Workouts</a>
            <a href="/exercises.html">Exercises</a>
            <a href="/progress.html">Progress</a>
            <a href="/profile.html" aria-current="page" class="active">Profile</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="page-intro"><h1>Your Profile</h1><p>Update personal information and fitness preferences.</p></div>
<section id="profileSection">
            <h2>Personal Profile</h2>
            <form id="profileForm">
                <label for="profileName">Name:</label>
                <input id="profileName" name="name" type="text" required>

                <label for="profileAge">Age:</label>
                <input id="profileAge" name="age" type="number" min="1" step="1">

                <label for="profileHeight">Height (feet):</label>
                <input id="profileHeight" name="height" type="number" min="0.1" step="0.1">

                <label for="profileWeight">Weight:</label>
                <input id="profileWeight" name="weight" type="number" min="0.1" step="0.1">

                <label for="fitnessGoal">Fitness Goal:</label>
                <input id="fitnessGoal" name="fitnessGoal" type="text">

                <button type="submit" id="saveProfile">Save Profile</button>
            </form>
            <section id="bmiSection">
            <h3>BMI Calculator</h3>
            <p>Height is measured in feet and weight is measured in pounds.</p>

            <button type="button" id="calculateBMI">Calculate BMI</button>

            <p id="bmiResult" role="status" aria-live="polite">
            Enter your height and weight to calculate BMI.
    </p>
</section>

            <p id="profileMessage" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
