<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workouts | myFitness</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Generated by myFitness five-page restructuring -->
    <header class="site-header">
        <div class="site-header-inner">
            <a class="brand" href="/">myFitness</a>
            <nav class="site-nav" aria-label="Main navigation">
            <a href="/">Dashboard</a>
            <a href="/workouts.html" aria-current="page" class="active">Workouts</a>
            <a href="/exercises.html">Exercises</a>
            <a href="/progress.html">Progress</a>
            <a href="/profile.html">Profile</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="page-intro"><h1>Workouts</h1><p>Generate a workout, complete your exercises and track intervals.</p></div>
<section id="workoutPickerSection">
            <h2>Pick a Workout for Me</h2>

            <label for="workoutType">Type:</label>
            <select id="workoutType">
                <option value="Strength">Strength</option>
                <option value="Cardio">Cardio</option>
            </select>

            <label for="workoutLocation">Location:</label>
            <select id="workoutLocation">
                <option value="Home">Home</option>
                <option value="Gym">Gym</option>
            </select>

            <label for="experienceLevel">Experience:</label>
            <select id="experienceLevel">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>

            <label for="workoutDuration">Available Time:</label>
            <select id="workoutDuration">
                <option value="15">15 minutes</option>
                <option value="30" selected>30 minutes</option>
                <option value="45">45 minutes</option>
                <option value="60">60 minutes</option>
            </select>

            <button id="pickWorkout" type="button">
                Pick a Workout for Me
            </button>

            <div id="workoutResults"></div>

            <button
                id="saveWorkoutBtn"
                type="button"
                style="display: none; margin-top: 15px;"
            >
                Complete Workout
            </button>
            <p id="saveMessage" aria-live="polite"></p>
        </section>

<section id="workoutTimerSection">
            <h2>Workout Interval Timer</h2>

            <label for="timerDuration">
                Interval Duration (seconds):
            </label>

            <input
                type="number"
                id="timerDuration"
                min="1"
                value="30"
            >

            <label for="restDuration">Rest Duration (seconds):</label>
            <input type="number" id="restDuration" min="1" value="20">
            <p id="timerPhase">Work</p>
            <h3 id="timerDisplay">00:30</h3>

            <button id="startTimer" type="button">Start</button>
            <button id="pauseTimer" type="button">Pause</button>
            <button id="resetTimer" type="button">Reset</button>

            <p id="timerMessage" aria-live="polite"></p>
        </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/workouts.js"></script>
</body>
</html>
