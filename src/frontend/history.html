<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout History</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>myFitness - History</h1>
        <nav><a href="/">Back to Dashboard</a></nav>
    </header>
    <main>
        <section>
            <h2>Progress Summary</h2>
            <p>Total Completed Workouts: <strong id="totalWorkouts">0</strong></p>
            <p>Workouts This Week (Monday to Today): <strong id="weeklyWorkouts">0</strong></p>
            <p>Workouts This Month (Calendar Month): <strong id="monthlyWorkouts">0</strong></p>
        </section>
        <hr>
        <section>
            <h2>Workout Log</h2>
            <div id="historyList"></div>
        </section>
    </main>
    <script src="/js/history.js"></script>
</body>
</html>
