
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>myFitness</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header>
        <h1>myFitness</h1>

        <nav>
            <a href="/history.html">View Workout History</a>
        </nav>
    </header>

    <main>
        <!-- Personal Profile -->
        <section id="profileSection">
            <h2>Personal Profile</h2>

            <form id="profileForm">
                <label for="profileName">Name:</label>
                <input id="profileName" name="name" type="text" required>

                <label for="profileAge">Age:</label>
                <input id="profileAge" name="age" type="number" min="1" step="1">

                <label for="profileHeight">Height:</label>
                <input id="profileHeight" name="height" type="number" min="0.1" step="0.1">

                <label for="profileWeight">Weight:</label>
                <input id="profileWeight" name="weight" type="number" min="0.1" step="0.1">

                <label for="fitnessGoal">Fitness Goal:</label>
                <input id="fitnessGoal" name="fitnessGoal" type="text">

                <button type="submit" id="saveProfile">
                    Save Profile
                </button>
            </form>

            <p id="profileMessage" role="status" aria-live="polite"></p>
        </section>

        <hr>

        <!-- Exercise Library -->
        <section id="exerciseLibrarySection">
            <h2>Exercise Library</h2>

            <label for="typeFilter">Type:</label>
            <select id="typeFilter">
                <option value="">All</option>
                <option value="Strength">Strength</option>
                <option value="Cardio">Cardio</option>
                <option value="Flexibility">Flexibility</option>
            </select>

            <label for="locationFilter">Location:</label>
            <select id="locationFilter">
                <option value="">Any</option>
                <option value="Home">Home</option>
                <option value="Gym">Gym</option>
                <option value="Outdoors">Outdoors</option>
            </select>

            <button id="loadExercises" type="button">
                Load Exercises
            </button>

            <div id="exerciseList"></div>
        </section>

        <hr>

        <!-- Workout Picker -->
        <section id="workoutPickerSection">
            <h2>Pick a Workout for Me</h2>

            <label for="workoutType">Type:</label>
            <select id="workoutType">
                <option value="Strength">Strength</option>
                <option value="Cardio">Cardio</option>
            </select>

            <label for="workoutLocation">Location:</label>
            <select id="workoutLocation">
                <option value="Home">Home</option>
                <option value="Gym">Gym</option>
            </select>

            <button id="pickWorkout" type="button">
                Pick a Workout for Me
            </button>

            <div id="workoutResults"></div>

            <button
                id="saveWorkoutBtn"
                type="button"
                style="display: none; margin-top: 15px;"
            >
                Save This Workout
            </button>

            <p id="saveMessage" aria-live="polite"></p>
        </section>

        <hr>

        <!-- Workout Interval Timer -->
        <section id="workoutTimerSection">
            <h2>Workout Interval Timer</h2>

            <label for="timerDuration">
                Interval Duration (seconds):
            </label>

            <input
                type="number"
                id="timerDuration"
                min="1"
                value="30"
            >

            <h3 id="timerDisplay">00:30</h3>

            <button id="startTimer" type="button">
                Start
            </button>

            <button id="pauseTimer" type="button">
                Pause
            </button>

            <button id="resetTimer" type="button">
                Reset
            </button>

            <p id="timerMessage"></p>
        </section>

        <hr>

        <!-- Progress Summary -->
        <section id="progressSection">
            <h2>Progress Summary</h2>

            <p>
                This Week:
                <strong id="weeklyWorkoutCount">0</strong>
                workouts
            </p>

            <p>
                This Month:
                <strong id="monthlyWorkoutCount">0</strong>
                workouts
            </p>

            <button id="refreshProgress" type="button">
                Refresh Progress
            </button>

            <p id="progressMessage" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
