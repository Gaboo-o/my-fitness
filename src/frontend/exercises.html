<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Library | myFitness</title>
    <link rel="stylesheet" href="/css/style.css">

<body>
    <!-- Generated by myFitness five-page restructuring -->

    <main>
        <div class="page-intro"><h1>Exercise Library</h1><p>Choose a type and location to explore exercises.</p></div>
<section id="exerciseLibrarySection">
            <h2>Exercise Library</h2>

            <label for="typeFilter">Type:</label>
            <select id="typeFilter">
                <option value="">All</option>
                <option value="Strength">Strength</option>
                <option value="Cardio">Cardio</option>
            </select>

            <label for="locationFilter">Location:</label>
            <select id="locationFilter">
                <option value="">Any</option>
                <option value="Home">Home</option>
                <option value="Gym">Gym</option>
                <option value="Outdoor">Outdoors</option>
            </select>

            <button id="loadExercises" type="button">Load Exercises</button>
            <div id="exerciseList"></div>
        </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/exercises.js"></script>
